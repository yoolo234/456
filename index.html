<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能提示词学习与闯关平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .progress-bar {
            transition: width 0.3s ease;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .option-btn:hover {
            background-color: #f3f4f6;
        }
        
        .option-btn.selected {
            background-color: #4f46e5;
            color: white;
        }
        
        .option-btn.correct {
            background-color: #10b981;
            color: white;
        }
        
        .option-btn.wrong {
            background-color: #ef4444;
            color: white;
        }
        
        /* Dark mode styles */
        .dark body {
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        
        .dark .bg-white {
            background-color: #16213e;
        }
        
        .dark .text-gray-800 {
            color: #e0e0e0;
        }
        
        .dark .text-gray-600 {
            color: #a0a0a0;
        }
        
        .dark .bg-gray-50 {
            background-color: #0f3460;
        }
        
        .dark .bg-gray-100 {
            background-color: #1a1a2e;
        }
        
        .dark .bg-gray-200 {
            background-color: #16213e;
        }
        
        .dark .border-gray-200 {
            border-color: #0f3460;
        }
        
        .dark .option-btn:hover {
            background-color: #0f3460;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        .bg-primary { background-color: var(--primary-color); }
        .text-primary { color: var(--primary-color); }
        .bg-success { background-color: var(--success-color); }
        .bg-danger { background-color: var(--danger-color); }
        .bg-warning { background-color: var(--warning-color); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white py-6 shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">
                        <i class="fa fa-graduation-cap mr-2"></i>智能提示词学习与闯关平台
                    </h1>
                    <p class="mt-2 text-blue-100">掌握AI提示词技巧，提升人机交互效率</p>
                </div>
                <button id="theme-toggle" class="p-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors">
                    <i class="fa fa-moon-o text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex space-x-2 py-3 overflow-x-auto">
                <button tab-target="cards" class="tab-btn active px-5 py-3 rounded-lg bg-primary text-white font-medium whitespace-nowrap">
                    <i class="fa fa-book mr-2"></i>知识卡片
                </button>
                <button tab-target="theory" class="tab-btn px-5 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 font-medium whitespace-nowrap">
                    <i class="fa fa-question-circle mr-2"></i>基础理论闯关
                </button>
                <button tab-target="practice" class="tab-btn px-5 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 font-medium whitespace-nowrap">
                    <i class="fa fa-pencil mr-2"></i>场景编写练习
                </button>
                <button tab-target="agent" class="tab-btn px-5 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 font-medium whitespace-nowrap">
                    <i class="fa fa-robot mr-2"></i>智能助手
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- 知识卡片区域 -->
        <div id="cards" class="tab-content">
            <div class="mb-6">
                <h2 class="text-2xl font-bold mb-2">提示词核心知识</h2>
                <p class="text-gray-600 dark:text-gray-400">点击卡片查看详细说明，掌握提示词工程的核心技巧</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cards-container">
                <!-- 卡片将通过JS动态生成 -->
            </div>
        </div>

        <!-- 基础理论闯关区域 -->
        <div id="theory" class="tab-content hidden">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white dark:bg-gray-800 rounded-xl card-shadow p-6 mb-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">基础理论闯关</h2>
                        <div class="text-sm text-gray-600 dark:text-gray-400">
                            进度: <span id="score-text">0/5 正确</span>
                        </div>
                    </div>
                    
                    <!-- 进度条 -->
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-6">
                        <div id="progress-bar" class="bg-primary h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                    </div>
                    
                    <!-- 题目区域 -->
                    <div id="question-container" class="mb-6">
                        <!-- 题目将通过JS动态插入 -->
                    </div>
                    
                    <!-- 选项区域 -->
                    <div id="answer-buttons" class="flex flex-col space-y-3 mb-6">
                        <!-- 选项将通过JS动态插入 -->
                    </div>
                    
                    <!-- 导航按钮 -->
                    <div class="flex justify-between">
                        <button id="prev-btn" class="px-6 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <i class="fa fa-arrow-left mr-2"></i>上一题
                        </button>
                        <button id="next-btn" class="px-6 py-2 bg-primary text-white rounded-lg font-medium hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            下一题<i class="fa fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 结果展示 -->
                <div id="theory-result" class="hidden bg-white dark:bg-gray-800 rounded-xl card-shadow p-8 text-center">
                    <i id="result-icon" class="fa fa-trophy text-5xl mb-4 text-yellow-500"></i>
                    <h3 class="text-2xl font-bold mb-2">闯关完成!</h3>
                    <p id="final-score" class="text-xl text-primary font-bold mb-4"></p>
                    <p id="result-desc" class="text-gray-600 dark:text-gray-400 mb-6"></p>
                    <button id="restart-theory" class="px-8 py-3 bg-primary text-white rounded-lg font-medium hover:opacity-90">
                        <i class="fa fa-refresh mr-2"></i>重新挑战
                    </button>
                </div>
            </div>
        </div>

        <!-- 场景编写练习区域 -->
        <div id="practice" class="tab-content hidden">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white dark:bg-gray-800 rounded-xl card-shadow p-6 mb-6">
                    <h2 class="text-2xl font-bold mb-4">场景编写练习</h2>
                    <p class="text-gray-600 dark:text-gray-400 mb-6">选择一个场景，编写提示词并提交，系统将自动评估你的提示词质量</p>
                    
                    <!-- 场景选择 -->
                    <div class="mb-6">
                        <button id="random-scenario-btn" class="w-full p-4 border-2 border-primary bg-blue-50 dark:bg-blue-900/20 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/30 transition-colors text-left">
                            <i class="fa fa-random text-2xl text-primary mb-2"></i>
                            <h4 class="font-bold">点击随机选择题目</h4>
                            <p class="text-sm text-gray-600 dark:text-gray-400">系统将随机给出一个练习场景</p>
                        </button>
                    </div>
                    
                    <!-- 练习区域 -->
                    <div id="practice-area" class="hidden">
                        <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-lg mb-4">
                            <h4 class="font-bold mb-2">场景要求:</h4>
                            <p id="scenario-desc" class="text-gray-700 dark:text-gray-300"></p>
                        </div>
                        
                        <textarea id="prompt-input" class="w-full h-40 p-4 border-2 border-gray-200 dark:border-gray-700 rounded-lg resize-none focus:border-primary focus:outline-none dark:bg-gray-800" placeholder="在此编写你的提示词..."></textarea>
                        
                        <div class="flex justify-end mt-4 space-x-3">
                            <button id="clear-btn" class="px-6 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600">
                                <i class="fa fa-trash mr-2"></i>清空
                            </button>
                            <button id="submit-btn" class="px-6 py-2 bg-primary text-white rounded-lg hover:opacity-90">
                                <i class="fa fa-paper-plane mr-2"></i>提交评估
                            </button>
                        </div>
                    </div>
                    
                    <!-- 评估结果 -->
                    <div id="evaluation-result" class="hidden mt-6 p-6 bg-gray-50 dark:bg-gray-900 rounded-lg">
                        <h4 class="font-bold text-lg mb-4">评估结果</h4>
                        <div id="evaluation-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 智能助手区域 -->
        <div id="agent" class="tab-content hidden">
            <div class="max-w-4xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-center">智能助手</h2>
                <div class="bg-white dark:bg-gray-800 rounded-xl card-shadow overflow-hidden">
                    <iframe id="coze-web-sdk" src="https://sdk.coze.site" style="width: 100%; height: 600px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 智能提示词学习与闯关平台. 让AI更好地理解你的需求.</p>
        </div>
    </footer>

    <script>
        // 知识卡片数据
        const cardsData = [
            {
                id: 1,
                title: "清晰明确原则",
                icon: "fa-bullseye",
                color: "text-blue-500",
                shortDesc: "提示词必须具体、清晰，避免模糊表述",
                fullDesc: "提示词必须具体、清晰，避免模糊表述。包含明确的任务、格式、要求，AI才能准确理解你的意图。",
                example: {
                    bad: "写一篇文章",
                    good: "写一篇800字的关于人工智能教育应用的议论文"
                }
            },
            {
                id: 2,
                title: "角色设定法",
                icon: "fa-user-circle",
                color: "text-purple-500",
                shortDesc: "给AI指定一个专业角色",
                fullDesc: "给AI指定一个专业角色，如专家、教师、设计师等，让AI从对应角色的专业视角回答问题，提升输出质量。",
                example: {
                    good: "你是一名资深小学数学老师，用通俗易懂的语言讲解鸡兔同笼问题"
                }
            },
            {
                id: 3,
                title: "格式指定法",
                icon: "fa-list-alt",
                color: "text-green-500",
                shortDesc: "明确要求AI输出的格式",
                fullDesc: "明确要求AI输出的格式，如表格、列表、JSON、markdown、步骤拆解等，让结果更规整、便于使用。",
                example: {
                    good: "请以表格形式输出，包含名称、用途、优缺点三列内容"
                }
            },
            {
                id: 4,
                title: "约束条件",
                icon: "fa-compress",
                color: "text-orange-500",
                shortDesc: "添加字数、风格等约束条件",
                fullDesc: "添加字数、语言风格、时间范围、禁止内容等约束条件，让输出结果更符合预期，避免偏离需求。",
                example: {
                    good: "字数控制在500字以内，语言正式，不要使用网络流行语"
                }
            },
            {
                id: 5,
                title: "上下文连贯性",
                icon: "fa-link",
                color: "text-indigo-500",
                shortDesc: "多轮对话中保持上下文一致",
                fullDesc: "多轮对话中保持上下文一致，复杂任务可以分步骤描述，让AI理解完整逻辑，提升交互准确性。",
                example: {
                    good: "先说明背景，再提出任务，最后补充要求，形成完整逻辑链"
                }
            },
            {
                id: 6,
                title: "示例引导法",
                icon: "fa-lightbulb-o",
                color: "text-yellow-500",
                shortDesc: "提供1-2个输出示例",
                fullDesc: "提供1-2个输出示例，让AI直接参考你的格式和风格，是最高效的提示词优化方法之一。",
                example: {
                    good: "请像下面这样回答：问题：XX 答案：XX"
                }
            }
        ];

        // 场景练习数据
        const scenarios = {
            email: {
                title: "邮件撰写",
                desc: "你需要给客户发送一封邮件，说明项目延期的原因，并表示歉意。请编写一个提示词，要求AI生成一封正式、诚恳的商务邮件。",
                criteria: ["明确邮件目的", "指定语气和风格", "包含必要信息"]
            },
            summary: {
                title: "内容总结",
                desc: "你有一篇3000字的技术文章，需要快速获取核心要点。请编写一个提示词，要求AI将文章总结为3-5个关键点，并保留重要细节。",
                criteria: ["指定总结长度", "要求保留关键信息", "明确输出格式"]
            },
            code: {
                title: "代码生成",
                desc: "你需要一个Python函数来处理CSV文件，要求能够读取文件、过滤数据并保存结果。请编写一个提示词，要求AI生成完整、可运行的代码。",
                criteria: ["明确编程语言", "描述功能需求", "要求代码注释"]
            },
            story: {
                title: "故事创作",
                desc: "你想创作一个科幻短篇小说。请编写一个提示词，要求AI创作一个发生在未来城市的冒险故事，包含一个勇敢的主角和一个神秘的谜团。",
                criteria: ["设定故事背景", "描述主角特征", "指定故事风格"]
            },
            product: {
                title: "产品描述",
                desc: "你有一款智能手表产品需要推广。请编写一个提示词，要求AI撰写一段吸引人的产品描述，突出其健康监测和智能提醒功能。",
                criteria: ["突出产品卖点", "描述目标用户", "使用营销语言"]
            },
            qa: {
                title: "问题解答",
                desc: "你正在准备一场技术面试。请编写一个提示词，要求AI详细解释什么是机器学习中的梯度下降算法，并用简单易懂的语言说明其原理。",
                criteria: ["明确问题主题", "要求详细解释", "使用通俗语言"]
            },
            speech: {
                title: "演讲稿撰写",
                desc: "你需要在公司年会上发表演讲。请编写一个提示词，要求AI撰写一篇激励员工的演讲稿，回顾过去一年的成就并展望未来。",
                criteria: ["明确演讲目的", "指定受众群体", "要求激励风格"]
            },
            social: {
                title: "社交媒体帖子",
                desc: "你想为公司的新产品发布写一条微博。请编写一个提示词，要求AI创作一条吸引人的社交媒体帖子，包含相关话题标签和呼吁行动。",
                criteria: ["指定平台风格", "包含关键词", "呼吁用户互动"]
            }
        };

        // DOM 元素
        const cardsContainer = document.getElementById('cards-container');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        const themeToggle = document.getElementById('theme-toggle');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
            initTabs();
            initTheme();
            initPractice();
            initCozeSDK();
        });

        // 渲染知识卡片
        function renderCards() {
            cardsContainer.innerHTML = cardsData.map(card => `
                <div class="bg-white dark:bg-gray-800 rounded-xl card-shadow card-hover p-6 cursor-pointer transition-all duration-300" onclick="toggleCard(${card.id})">
                    <div class="flex items-start justify-between mb-4">
                        <i class="fa ${card.icon} text-3xl ${card.color}"></i>
                        <span class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded">点击展开</span>
                    </div>
                    <h3 class="text-xl font-bold mb-2">${card.title}</h3>
                    <p class="text-gray-600 dark:text-gray-400 text-sm mb-4">${card.shortDesc}</p>
                    <div id="card-detail-${card.id}" class="hidden border-t dark:border-gray-700 pt-4 mt-4">
                        <p class="text-gray-700 dark:text-gray-300 mb-4">${card.fullDesc}</p>
                        ${card.example.bad ? `
                            <div class="bg-red-50 dark:bg-red-900/20 p-3 rounded-lg mb-2">
                                <span class="text-red-500 font-bold text-xs">❌ 反例:</span>
                                <p class="text-sm mt-1">${card.example.bad}</p>
                            </div>
                        ` : ''}
                        <div class="bg-green-50 dark:bg-green-900/20 p-3 rounded-lg">
                            <span class="text-green-500 font-bold text-xs">✓ 正例:</span>
                            <p class="text-sm mt-1">${card.example.good}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 切换卡片展开/收起
        function toggleCard(id) {
            const detail = document.getElementById(`card-detail-${id}`);
            detail.classList.toggle('hidden');
            detail.classList.toggle('fade-in');
        }

        // 初始化选项卡
        function initTabs() {
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 移除所有活动状态
                    tabBtns.forEach(b => {
                        b.classList.remove('active', 'bg-primary', 'text-white');
                        b.classList.add('bg-gray-200', 'dark:bg-gray-700');
                    });
                    tabContents.forEach(c => c.classList.add('hidden'));
                    
                    // 激活当前选项卡
                    btn.classList.add('active', 'bg-primary', 'text-white');
                    btn.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                    document.getElementById(btn.getAttribute('tab-target')).classList.remove('hidden');
                });
            });
        }

        // 题目数据库（从外部JSON文件加载）
        let questionDatabase = [];
        let questionDB = null;

        // 加载题目数据库
        async function loadQuestionDatabase() {
            try {
                const response = await fetch('questions.json');
                if (!response.ok) {
                    throw new Error('Failed to load question database');
                }
                const data = await response.json();
                questionDatabase = data.questions || [];
                // 数据库加载完成后，初始化闯关
                startQuiz();
                return true;
            } catch (error) {
                // 使用备用数据
                questionDatabase = getBackupQuestions();
                // 即使使用备用数据也要初始化闯关
                startQuiz();
                return false;
            }
        }

        // 备用题目数据（当JSON加载失败时使用）
        function getBackupQuestions() {
            return [
                {
                    id: 1,
                    category: "基础概念",
                    question: "以下哪项属于优秀提示词的核心原则？",
                    options: ["越简短越好", "清晰明确，包含具体要求", "使用专业术语", "让AI自由发挥"],
                    answer: 1,
                    explanation: "优秀的提示词应该清晰明确，包含具体的任务描述和要求。"
                },
                {
                    id: 2,
                    category: "角色设定",
                    question: "\"你是一名专业的健康营养师\"属于提示词的哪种技巧？",
                    options: ["格式指定", "角色设定", "约束条件", "示例引导"],
                    answer: 1,
                    explanation: "角色设定法是指向AI指定一个专业角色。"
                },
                {
                    id: 3,
                    category: "格式指定",
                    question: "如果希望AI输出规整的表格，应该在提示词中添加什么？",
                    options: ["字数限制", "角色设定", "格式要求", "语言风格"],
                    answer: 2,
                    explanation: "明确指定输出格式可以让AI生成更规整的结果。"
                },
                {
                    id: 4,
                    category: "约束条件",
                    question: "在提示词中添加字数限制属于哪种技巧？",
                    options: ["角色设定", "格式指定", "约束条件", "示例引导"],
                    answer: 2,
                    explanation: "约束条件包括字数限制、语言风格等。"
                },
                {
                    id: 5,
                    category: "示例引导",
                    question: "在提示词中添加示例的主要作用是？",
                    options: ["增加字数", "让AI参考格式和风格", "降低AI理解难度", "让提示词更专业"],
                    answer: 1,
                    explanation: "提供示例可以让AI直接参考输出格式和风格。"
                }
            ];
        }

        // 从数据库中随机抽取题目
        function getRandomQuestions(count = 5) {
            const shuffled = [...questionDatabase].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, Math.min(count, shuffled.length));
        }

        // 页面加载时初始化数据库
        loadQuestionDatabase();

        // 理论闯关逻辑
        let currentQuestion = 0;
        let userAnswers = [];
        let score = 0;
        let currentQuestions = []; // 当前使用的题目列表（随机抽取）

        const questionContainer = document.getElementById('question-container');
        const answerButtons = document.getElementById('answer-buttons');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progressBar = document.getElementById('progress-bar');
        const scoreText = document.getElementById('score-text');
        const theoryResult = document.getElementById('theory-result');
        const finalScore = document.getElementById('final-score');
        const resultDesc = document.getElementById('result-desc');
        const restartTheory = document.getElementById('restart-theory');

        // 初始化题目（随机选题）
        function startQuiz() {
            currentQuestion = 0;
            userAnswers = [];
            score = 0;
            // 从数据库中随机抽取5道题目
            currentQuestions = getRandomQuestions(5);
            theoryResult.classList.add('hidden');
            document.getElementById('theory').querySelector('.max-w-3xl > div').classList.remove('hidden');
            showQuestion(currentQuestions[currentQuestion]);
            updateProgress();
        }

        // 显示题目
        function showQuestion(question) {
            questionContainer.innerHTML = `
                <p class="text-lg font-medium mb-4">${currentQuestion + 1}. ${question.question}</p>
            `;
            
            answerButtons.innerHTML = '';
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('w-full', 'p-4', 'rounded-lg', 'border-2', 'border-gray-200', 'dark:border-gray-600', 'text-left', 'hover:border-primary', 'hover:bg-gray-50', 'dark:hover:bg-gray-700', 'transition-all', 'duration-200');
                button.innerHTML = `<span class="inline-block w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 text-center leading-8 mr-3 font-medium">${String.fromCharCode(65 + index)}</span>${option}`;
                button.dataset.index = index;
                
                // 如果已经作答，显示答案
                if (userAnswers[currentQuestion] !== undefined) {
                    if (index === question.answer) {
                        button.classList.add('bg-success', 'text-white', 'border-success');
                        button.innerHTML = `<span class="inline-block w-8 h-8 rounded-full bg-white/20 text-center leading-8 mr-3 font-medium">${String.fromCharCode(65 + index)}</span>${option}`;
                    } else if (index === userAnswers[currentQuestion] && index !== question.answer) {
                        button.classList.add('bg-danger', 'text-white', 'border-danger');
                        button.innerHTML = `<span class="inline-block w-8 h-8 rounded-full bg-white/20 text-center leading-8 mr-3 font-medium">${String.fromCharCode(65 + index)}</span>${option}`;
                    } else {
                        button.classList.add('opacity-50');
                    }
                }
                
                button.addEventListener('click', () => selectAnswer(index, button));
                answerButtons.appendChild(button);
            });
            
            // 按钮状态
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = userAnswers[currentQuestion] === undefined;
        }

        // 选择答案
        function selectAnswer(index, button) {
            if (userAnswers[currentQuestion] !== undefined) return;
            
            userAnswers[currentQuestion] = index;
            const correct = currentQuestions[currentQuestion].answer;
            
            // 显示正确/错误
            const allButtons = answerButtons.querySelectorAll('button');
            allButtons.forEach(btn => {
                btn.classList.remove('hover:bg-gray-100', 'dark:hover:bg-gray-700', 'hover:border-primary', 'hover:bg-gray-50');
                btn.classList.add('cursor-not-allowed');
                if (parseInt(btn.dataset.index) === correct) {
                    btn.classList.add('bg-success', 'text-white', 'border-success');
                    btn.innerHTML = `<span class="inline-block w-8 h-8 rounded-full bg-white/20 text-center leading-8 mr-3 font-medium">${String.fromCharCode(65 + parseInt(btn.dataset.index))}</span>${btn.textContent.replace(/^[A-D]\.\s*/, '')}`;
                } else if (parseInt(btn.dataset.index) === index && index !== correct) {
                    btn.classList.add('bg-danger', 'text-white', 'border-danger');
                    btn.innerHTML = `<span class="inline-block w-8 h-8 rounded-full bg-white/20 text-center leading-8 mr-3 font-medium">${String.fromCharCode(65 + parseInt(btn.dataset.index))}</span>${btn.textContent.replace(/^[A-D]\.\s*/, '')}`;
                } else {
                    btn.classList.add('opacity-50');
                }
                btn.disabled = true;
            });
            
            // 计算分数
            calculateScore();
            
            // 自动跳转到下一题（延迟1.5秒）
            if (currentQuestion < currentQuestions.length - 1) {
                // 显示即将跳转的提示
                nextBtn.textContent = '即将进入下一题...';
                nextBtn.disabled = true;
                
                setTimeout(() => {
                    currentQuestion++;
                    showQuestion(currentQuestions[currentQuestion]);
                    updateProgress();
                    nextBtn.textContent = '下一题<i class="fa fa-arrow-right ml-2"></i>';
                }, 1500);
            } else {
                // 最后一题，显示结果
                setTimeout(() => {
                    showResult();
                }, 1500);
            }
        }

        // 计算分数
        function calculateScore() {
            score = 0;
            currentQuestions.forEach((q, i) => {
                if (userAnswers[i] === q.answer) score++;
            });
            updateProgress();
        }

        // 更新进度
        function updateProgress() {
            const progress = (currentQuestion + 1) / currentQuestions.length * 100;
            progressBar.style.width = `${progress}%`;
            scoreText.textContent = `${score}/${currentQuestions.length} 正确`;
        }

        // 下一题
        nextBtn.addEventListener('click', () => {
            currentQuestion++;
            if (currentQuestion < currentQuestions.length) {
                showQuestion(currentQuestions[currentQuestion]);
            } else {
                showResult();
            }
        });

        // 上一题
        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestions[currentQuestion]);
            }
        });

        // 显示结果
        function showResult() {
            document.getElementById('theory').querySelector('.max-w-3xl > div').classList.add('hidden');
            theoryResult.classList.remove('hidden');
            finalScore.textContent = `最终得分：${score}/${currentQuestions.length}`;
            
            let desc, icon;
            const total = currentQuestions.length;
            const percentage = score / total;
            
            if (percentage === 1) {
                desc = '太棒了！你已经完全掌握了提示词基础理论！';
                icon = 'fa-trophy text-yellow-500';
            } else if (percentage >= 0.6) {
                desc = '表现不错！继续学习知识卡片就能拿满分！';
                icon = 'fa-smile-o text-green-500';
            } else {
                desc = '加油！多看看知识卡片，重新挑战吧！';
                icon = 'fa-frown-o text-gray-500';
            }
            
            resultDesc.textContent = desc;
            document.getElementById('result-icon').className = `fa ${icon} text-5xl mb-4`;
        }

        // 重新开始
        restartTheory.addEventListener('click', startQuiz);

        // 注意：startQuiz() 现在由 loadQuestionDatabase() 在数据库加载完成后调用

        // 场景练习逻辑
        function initPractice() {
            const randomScenarioBtn = document.getElementById('random-scenario-btn');
            const practiceArea = document.getElementById('practice-area');
            const scenarioDesc = document.getElementById('scenario-desc');
            const promptInput = document.getElementById('prompt-input');
            const submitBtn = document.getElementById('submit-btn');
            const clearBtn = document.getElementById('clear-btn');
            const evaluationResult = document.getElementById('evaluation-result');
            const evaluationContent = document.getElementById('evaluation-content');
            
            let currentScenario = null;
            
            // 随机选择场景
            randomScenarioBtn.addEventListener('click', () => {
                const scenarioKeys = Object.keys(scenarios);
                const randomKey = scenarioKeys[Math.floor(Math.random() * scenarioKeys.length)];
                currentScenario = randomKey;
                const scenario = scenarios[randomKey];
                
                scenarioDesc.innerHTML = `<strong>${scenario.title}</strong><br><br>${scenario.desc}`;
                practiceArea.classList.remove('hidden');
                evaluationResult.classList.add('hidden');
                promptInput.value = '';
                
                console.log('Random scenario selected:', scenario.title);
            });
            
            // 清空输入
            clearBtn.addEventListener('click', () => {
                promptInput.value = '';
            });
            
            // 提交评估
            submitBtn.addEventListener('click', () => {
                const prompt = promptInput.value.trim();
                if (!prompt) {
                    alert('请先编写提示词');
                    return;
                }
                
                const evaluation = evaluatePrompt(prompt, currentScenario);
                showEvaluation(evaluation);
            });
            
            // 评估提示词
            function evaluatePrompt(prompt, scenario) {
                const criteria = scenarios[scenario].criteria;
                const checks = [];
                let score = 0;
                
                // 检查各项标准
                if (prompt.length > 20) {
                    checks.push({ name: '内容完整度', status: 'good', message: '提示词内容较为完整' });
                    score += 30;
                } else {
                    checks.push({ name: '内容完整度', status: 'warning', message: '提示词可以更详细一些' });
                    score += 15;
                }
                
                if (prompt.includes('请') || prompt.includes('需要') || prompt.includes('要求')) {
                    checks.push({ name: '礼貌用语', status: 'good', message: '使用了恰当的礼貌用语' });
                    score += 20;
                } else {
                    checks.push({ name: '礼貌用语', status: 'neutral', message: '可以适当添加礼貌用语' });
                    score += 10;
                }
                
                if (/\d+/.test(prompt) || prompt.includes('字') || prompt.includes('个')) {
                    checks.push({ name: '具体约束', status: 'good', message: '包含了具体的数量或格式约束' });
                    score += 30;
                } else {
                    checks.push({ name: '具体约束', status: 'warning', message: '建议添加字数、格式等具体约束' });
                    score += 10;
                }
                
                if (prompt.includes('例如') || prompt.includes('比如') || prompt.includes('像')) {
                    checks.push({ name: '示例引导', status: 'good', message: '使用了示例引导技巧' });
                    score += 20;
                } else {
                    checks.push({ name: '示例引导', status: 'neutral', message: '可以添加示例帮助AI理解' });
                }
                
                let level, message;
                if (score >= 80) {
                    level = 'excellent';
                    message = '优秀的提示词！你已经掌握了提示词工程的核心技巧。';
                } else if (score >= 60) {
                    level = 'good';
                    message = '不错的提示词！还有提升空间，参考建议继续优化。';
                } else {
                    level = 'needs-improvement';
                    message = '提示词需要改进，建议多学习知识卡片中的技巧。';
                }
                
                return { score, level, message, checks, criteria };
            }
            
            // 显示评估结果
            function showEvaluation(evaluation) {
                const levelColors = {
                    'excellent': 'text-green-500',
                    'good': 'text-blue-500',
                    'needs-improvement': 'text-orange-500'
                };
                
                const levelIcons = {
                    'excellent': 'fa-check-circle',
                    'good': 'fa-thumbs-up',
                    'needs-improvement': 'fa-exclamation-circle'
                };
                
                evaluationContent.innerHTML = `
                    <div class="mb-6 text-center">
                        <i class="fa ${levelIcons[evaluation.level]} text-5xl ${levelColors[evaluation.level]} mb-2"></i>
                        <div class="text-3xl font-bold ${levelColors[evaluation.level]}">${evaluation.score}分</div>
                        <p class="text-gray-600 dark:text-gray-400 mt-2">${evaluation.message}</p>
                    </div>
                    
                    <div class="space-y-3">
                        ${evaluation.checks.map(check => `
                            <div class="flex items-start space-x-3 p-3 bg-white dark:bg-gray-800 rounded-lg">
                                <i class="fa ${check.status === 'good' ? 'fa-check-circle text-green-500' : check.status === 'warning' ? 'fa-exclamation-triangle text-yellow-500' : 'fa-info-circle text-gray-400'} mt-1"></i>
                                <div>
                                    <div class="font-medium">${check.name}</div>
                                    <div class="text-sm text-gray-600 dark:text-gray-400">${check.message}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
                        <div class="font-bold mb-2">💡 优化建议</div>
                        <ul class="text-sm text-gray-700 dark:text-gray-300 space-y-1">
                            <li>• 确保提示词包含明确的任务描述</li>
                            <li>• 添加角色设定以提升专业性</li>
                            <li>• 指定输出格式和约束条件</li>
                            <li>• 必要时提供示例引导</li>
                        </ul>
                    </div>
                `;
                
                evaluationResult.classList.remove('hidden');
            }
        }

        // 主题切换
        function initTheme() {
            const html = document.documentElement;
            
            // 检查本地存储或系统偏好
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            
            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
            });
        }

        // Coze Web SDK 初始化
        function initCozeSDK() {
            const COZE_WEB_SDK_ORIGIN = 'https://sdk.coze.site';
            
            // 智能助手初始化函数
            function initCozeAgent() {
                const cozeWebSDK = document.getElementById('coze-web-sdk');
                if (!cozeWebSDK) {
                    console.error('Coze Web SDK iframe not found');
                    return;
                }
                
                // 初始化配置
                const initConfig = {
                    type: 'INIT',
                    payload: {
                        token: 'pat_zxU5G1kqfIjznPklnguvhdTnu031VXNFZt1aD4fqBczmayY97VXzN9ArWhN8l7Qe',
                        projectId: '7623242875668660265',
                    }
                };
                
                console.log('Initializing Coze Web SDK with config:', initConfig);
                cozeWebSDK.contentWindow.postMessage(initConfig, COZE_WEB_SDK_ORIGIN);
            }
            
            // 消息监听器
            window.addEventListener('message', (event) => {
                // 验证消息来源
                if (event.origin !== COZE_WEB_SDK_ORIGIN) {
                    console.warn('Received message from unknown origin:', event.origin);
                    return;
                }
                
                const data = event.data;
                console.log('Received message from Coze SDK:', data);
                
                // SDK 加载完成
                if (data.type === 'IFRAME_READY') {
                    console.log('Coze SDK is ready, initializing...');
                    initCozeAgent();
                }
                
                // 初始化成功
                if (data.type === 'INIT_SUCCESS') {
                    console.log('Coze SDK initialized successfully');
                }
                
                // 初始化失败/权限错误
                if (data.type === 'INIT_FAILED' || data.type === 'ERROR') {
                    console.error('Coze SDK initialization failed:', data);
                    // 尝试重新初始化
                    setTimeout(() => {
                        console.log('Retrying initialization...');
                        initCozeAgent();
                    }, 3000);
                }
                
                // Token 过期
                if (data.type === 'TOKEN_EXPIRED') {
                    console.warn('Coze SDK token expired, updating...');
                    const cozeWebSDK = document.getElementById('coze-web-sdk');
                    if (cozeWebSDK) {
                        cozeWebSDK.contentWindow.postMessage({
                            type: 'UPDATE_TOKEN',
                            payload: {
                                token: 'pat_zxU5G1kqfIjznPklnguvhdTnu031VXNFZt1aD4fqBczmayY97VXzN9ArWhN8l7Qe',
                            }
                        }, COZE_WEB_SDK_ORIGIN);
                    }
                }
                
                // 其他消息类型
                if (data.type === 'MESSAGE_RECEIVED' || data.type === 'MESSAGE_SENT') {
                    console.log('Coze SDK message:', data);
                }
            });
            
            // 页面加载完成后尝试初始化
            document.addEventListener('DOMContentLoaded', () => {
                const cozeWebSDK = document.getElementById('coze-web-sdk');
                if (cozeWebSDK) {
                    // 监听 iframe 加载完成
                    cozeWebSDK.addEventListener('load', () => {
                        console.log('Coze iframe loaded');
                    });
                }
            });
        }
    </script>
